# PrivateGlue: self-hosted IT documentation
#
# Quick start:
#   echo "SECRET_KEY=$(openssl rand -hex 32)" > .env
#   docker compose up -d
# Then open http://localhost:5000 and create your admin account.
#
# This one file is used everywhere: this repo, privateglue-public and
# https://privateglue.app/docker-compose.yml. It works with plain docker compose,
# Dockge and Portainer: values come from the .env file next to it.
#
# Want PrivateGlue on the host network (needed to see MAC addresses when scanning from the
# server)? Use docker-compose.host.yml instead of this file.
#
# Build from source instead of pulling the image:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  privateglue:
    image: ghcr.io/marcmylemans/privateglue:${PRIVATEGLUE_TAG:-latest}
    ports:
      - "${PRIVATEGLUE_PORT:-5000}:5000"
    environment:
      # Required. Signs login sessions. Compose stops with this message if it's missing.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env, e.g. echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env}
      # Optional: user/group id that owns the data folders (default 1000:1000).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Optional: number of reverse proxies in front of the app (usually 1). Needed for the
      # login rate limit to see real visitor addresses. Leave at 0 without a proxy.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0}
      # Optional: "true" when the app is only reached over HTTPS (secure cookies, HSTS).
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      # Optional: "true" lets administrators scan a private network from this server
      # (Devices > Discovered). Leave it off on a server you share with others.
      # For MAC addresses too, use docker-compose.host.yml instead of this file.
      ALLOW_SERVER_SCAN: ${ALLOW_SERVER_SCAN:-false}
      # Optional: set to "off" to stop integrations from syncing on a schedule.
      INTEGRATIONS_SCHEDULER: ${INTEGRATIONS_SCHEDULER:-on}
    volumes:
      - ./notes:/app/notes      # Markdown notes
      - ./data:/app/data        # SQLite database
      - ./backups:/app/backups  # backups created from the UI
      - secretkey:/app/secret   # encryption key for stored credentials: back this up!
    restart: unless-stopped
    # Health check is built into the image.

volumes:
  secretkey:
