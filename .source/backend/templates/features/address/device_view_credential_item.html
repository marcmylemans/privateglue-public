{% if cred.address and feat.address.openable(cred.address) %}
<a class="btn btn-copy" href="{{ cred.address }}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ cred.title }} address (opens in a new tab)" title="Open {{ cred.address }}" data-audit="credential.address_opened" data-audit-target="credential:{{ cred.id }}"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></a>
{% endif %}
