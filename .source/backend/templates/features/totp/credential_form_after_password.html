{% set totp_saved = feat.totp.for_credential(credential) if editing else None %}
<div class="mt-3" data-totp-form>
  <label for="totp_secret" class="form-label">One-time code secret <span class="optional">{{ 'leave blank to keep the saved one' if totp_saved else 'optional' }}</span></label>
  <div class="input-group">
    <input type="password" class="form-control mono" id="totp_secret" name="totp_secret" autocomplete="off" spellcheck="false" autocapitalize="off"
           aria-describedby="totpHelp" placeholder="{{ '••••••••  (saved)' if totp_saved else 'Setup key or otpauth:// link' }}">
    <button type="button" class="btn btn-outline-secondary" data-totp-toggle aria-label="Show secret" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button>
    <button type="button" class="btn btn-outline-secondary" data-totp-test="{{ url_for('totp.test_code') }}" hidden>Test code</button>
  </div>
  <div class="form-text" id="totpHelp">The setup key shown next to the site's QR code, stored encrypted like the password.</div>
  <div class="form-text" data-totp-test-result aria-live="polite" hidden></div>
  {% if totp_saved %}
  <div class="form-check mt-2">
    <input class="form-check-input" type="checkbox" id="totp_remove" name="totp_remove" value="1">
    <label class="form-check-label" for="totp_remove">Remove the one-time code</label>
  </div>
  {% endif %}
</div>
