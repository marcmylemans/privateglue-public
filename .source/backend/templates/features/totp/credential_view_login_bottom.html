{% set otp = feat.totp.current(credential) %}
{% if otp %}
<div class="mt-3 totp{{ ' is-expiring' if otp.seconds_left is defined and otp.seconds_left <= 5 }}"{% if not otp.unreadable %} data-totp="{{ url_for('totp.code', id=credential.id) }}" data-totp-left="{{ otp.expires_in_ms }}" data-totp-period="{{ otp.period }}"{% endif %}>
  {% if otp.unreadable %}
    <div class="form-label">One-time code</div>
    <div class="form-text mt-0"><i class="bi bi-exclamation-circle" aria-hidden="true"></i> The saved secret cannot be read.{% if can_edit %} <a href="{{ url_for('credentials.edit_credential', id=credential.id) }}">Paste it again</a>{% endif %}</div>
  {% else %}
    <label class="form-label" for="credTotp">One-time code</label>
    <div class="input-group">
      <input type="text" class="form-control mono totp-code" id="credTotp" value="{{ otp.grouped }}" readonly autocomplete="off" aria-describedby="credTotpLeft">
      <button class="btn btn-outline-secondary" type="button" data-totp-copy aria-label="Copy one-time code" data-audit="credential.code_copied" data-audit-target="credential:{{ credential.id }}"><i class="bi bi-copy" aria-hidden="true"></i></button>
    </div>
    <div class="totp-meter" aria-hidden="true" hidden><span></span></div>
    <div class="form-text" id="credTotpLeft"><i class="bi bi-clock" aria-hidden="true"></i> <span data-totp-status>New code in {{ otp.seconds_left }} second{{ 's' if otp.seconds_left != 1 }}.</span></div>
  {% endif %}
</div>
{% endif %}
