{# The credential's tags as chips under the title. Each one opens the list filtered on it. #}
{% set tags_current = feat.tags.for_credential(credential) %}
{% if tags_current %}
<div class="mb-3">
  <div class="chip-list"><span class="visually-hidden">Tags:</span>
    {% for tag in tags_current %}<a href="{{ url_for('credentials.list_credentials', tag=tag) }}" class="chip chip-tag">#{{ tag }}</a>{% endfor %}
  </div>
</div>
{% endif %}
