{% set pwage_entries = feat.password_age.history(credential) %}
{% if pwage_entries %}
<section class="panel" aria-labelledby="pwageHistoryTitle">
  <div class="panel-header"><h2 class="panel-title" id="pwageHistoryTitle"><i class="bi bi-clock-history" aria-hidden="true"></i> Previous passwords <span class="count-pill">{{ pwage_entries|length }}</span></h2></div>
  <div class="panel-body">
    {% for entry in pwage_entries %}
    <div class="mb-3">
      <label class="form-label" for="pwageOld{{ entry.id }}">Replaced <time datetime="{{ entry.iso }}" title="{{ entry.exact }}">{{ entry.ago }}</time></label>
      <div class="input-group">
        <input type="password" class="form-control mono" id="pwageOld{{ entry.id }}" value="{{ entry.password }}" readonly autocomplete="off">
        <button class="btn btn-outline-secondary" type="button" data-pw-toggle="#pwageOld{{ entry.id }}" aria-label="Show password" aria-pressed="false" data-audit="credential.old_password_shown" data-audit-target="credential:{{ credential.id }}"><i class="bi bi-eye" aria-hidden="true"></i></button>
        <button class="btn btn-outline-secondary" type="button" data-copy="#pwageOld{{ entry.id }}" data-copy-message="Previous password copied" aria-label="Copy previous password" data-audit="credential.old_password_copied" data-audit-target="credential:{{ credential.id }}"><i class="bi bi-copy" aria-hidden="true"></i></button>
      </div>
    </div>
    {% endfor %}
    <div class="form-text"><i class="bi bi-lock" aria-hidden="true"></i> The last {{ feat.password_age.keep }} passwords are kept, encrypted. Older ones are removed.</div>
  </div>
</section>
{% endif %}
